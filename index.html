<style>
    .leaflet-popup-content-wrapper {
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
    }
    .leaflet-popup-content {
        margin: 0 !important;
        width: 250px !important;
    }
    .leaflet-popup-tip-container {
        display: none !important;
    }
    .leaflet-popup-close-button {
        display: none !important;
    }
    .popup-box {
        width: 250px;
        box-sizing: border-box;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        position: relative;
        overflow: visible;
    }
    .popup-header {
        background-color: #fac503;
        color: #000000;
        font-size: 14px;
        font-weight: bold;
        padding: 12px 15px;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
    }
    .popup-content {
        padding: 15px;
    }
    .popup-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
    }
    .popup-row:last-child {
        margin-bottom: 0;
    }
    .popup-box::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 10px 10px 0 10px;
        border-style: solid;
        border-color: #ffffff transparent transparent transparent; 
    }
    .label {
        font-weight: bold;
    }
    .leaflet-tooltip {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        opacity: 1 !important
    }
    .leaflet-tooltip-top:before {
        display: none !important;
    }
    .custom-tooltip {
        background-color: #fac503;
        font-size: 14px;
        font-weight: bold;
        padding: 8px;
        border-radius: 8px;
        position: relative;
        margin-bottom: 10px; 
    }
    .custom-tooltip::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 8px 8px 0 8px;
        border-style: solid;
        border-color: #ffffff transparent transparent transparent;
    }
    .custom-trajectory {
        background-color: #fac503;
        font-size: 14px;
        font-weight: bold;
        padding: 8px;
        border-radius: 8px;
        position: relative;
        margin-bottom: 10px; 
    }
